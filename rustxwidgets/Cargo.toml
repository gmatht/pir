[package]
name = "rustxwidgets"
version = "0.1.0"
edition = "2021"

[dependencies]
once_cell = "1.19"
thiserror = "1.0"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
rustyline = { version = "14", optional = true }
gtk_dynamic_loader = { path = "../gtk_dynamic_loader", optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0", features = ["flexbox", "menu"] }
winapi = { version = "0.3", features = ["winuser"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false, features = ["invocation"] }
ndk = "0.9"
ndk-context = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Document", "Element", "HtmlElement", "Node", "EventTarget",
  "HtmlButtonElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlTextAreaElement", "HtmlCanvasElement", "HtmlDialogElement",
  "HtmlDivElement", "HtmlSpanElement", "HtmlUListElement",   "HtmlLiElement",
  "HtmlOptionElement", "HtmlFormElement",   "HtmlHeadingElement", "HtmlBrElement",
  "MouseEvent", "KeyboardEvent", "Event", "FocusEvent",
  "CanvasRenderingContext2d", "CssStyleDeclaration", "DomTokenList",
  "HtmlCollection", "Window",
  "Text",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pancurses = { version = "0.17", optional = true }

[target.'cfg(unix)'.dependencies]
gtk4 = { path = "/root/tmp/gtk4-rs/gtk4", package = "gtk4", optional = true, features = ["v4_14"] }
glib-sys = { path = "/root/tmp/gtk4-rs/generated/glib-sys-dlopen", optional = true }
gio-sys = { path = "/root/tmp/gtk4-rs/generated/gio-sys-dlopen", optional = true }
gtk4-sys = { path = "/root/tmp/gtk4-rs/generated/gtk4-sys-dlopen", optional = true }
gdk4-sys = { path = "/root/tmp/gtk4-rs/generated/gdk4-sys-dlopen", optional = true }
cairo-sys-rs = { path = "/root/tmp/gtk4-rs/generated/cairo-sys-rs-dlopen", optional = true }
libc = "0.2"

[features]
default = ["gtk"]
gtk = ["dep:gtk_dynamic_loader"]
pancurses = ["dep:pancurses"]
zork = ["dep:rustyline", "dep:serde", "dep:serde_json"]
gtk4-rs = ["dep:gtk4", "dep:glib-sys", "dep:gio-sys", "dep:gtk4-sys", "dep:gdk4-sys", "dep:cairo-sys-rs"]
ratatui = ["dep:ratatui", "dep:crossterm"]
headless = []

[dev-dependencies]
proptest = "1.6"
serde_json = "1.0"
