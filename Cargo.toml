[package]
name = "pir"
version = "0.1.1"
edition = "2021"
description = "A featherweight pi-compatible terminal coding agent"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }   # default CommonMark/GFM parser used to render agent markdown output (zero heavy deps; no cli/getopts)
comrak = { version = "0.54", default-features = false, optional = true }   # optional heavier CommonMark/GFM backend (feature `comrak-backend`)
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }   # native-tls = (dynamic; drops static ring/rustls); gzip default feature dropped (unused)
native-tls = "0.2"                               # TLS provider for ureq (must be attached to the AgentBuilder explicitly)
rustyline = "14"                               # line editing: history + cursor nav + completer
libc = "0.2"                                     # uid/gid drop for per-project users
smol = "2"                                       # async runtime: event-driven stdin wait while a turn runs
regex = "1"                                      # history recall + streamdown-parser (full regex; replaces regex-lite)
streamdown-parser = "0.1.4"                      # O(n) streaming markdown parser (stateful, line-oriented)
streamdown-ansi = "0.1.4"                        # ANSI sanitize for link/terminal safety (pulled in by streamdown-parser)

# Optional TUI deps, only built when `--features tui` is set (so the default
# binary stays lightweight and the locked build cache is unaffected).
ratatui = { version = "0.29", optional = true }
# crossterm is non-optional: it's already in the tree transitively via
# streamdown-ansi, and the alternate-screen modal dialogs (docs/DIALOGS.md) use
# it in the default build. ratatui stays optional (TUI only).
crossterm = "0.28"

# Optional GUI deps (rustxwidgets) for the `gui` / `pancurses` REPL backends.
# Vendored in-tree at `vendors/rustxWidgets` (a real directory, shipped in
# git) so the default `gui` build and a plain `cargo build` both work with no
# external checkout. The `gui` backend uses rustxwidgets' dlopen'd GTK loader
# (the `rustxwidgets/gtk` feature); the `pancurses` backend uses ncurses.
rustxwidgets = { path = "vendors/rustxWidgets/rustxwidgets", version = "0.1.0", default-features = false, optional = true }

[features]
# Full-screen TUI REPL: a real layout engine (no hand-rolled ANSI block)
# with a conversation pane + footer pane (thinking + live draft prompt) and
# in-app scrollback. OFF by default — build/run with `--features tui`; pass
# `--no-tui` (or just build without the feature) to use the streaming REPL.
default = []
tui = ["dep:ratatui"]
# Swap the markdown renderer backend to comrak (a heavier CommonMark/GFM
# parser). OFF by default: the default backend is pulldown-cmark (smaller
# binary, same supported GFM subset for our terminal renderer). Keep comrak
# optional so the default `--release` binary drops its whole dependency tree.
comrak-backend = ["dep:comrak"]
# Graphical (GTK) REPL via rustxwidgets' dlopen'd GTK backend, and the curses
# (pancurses) REPL. Both are vendored in-tree at `vendors/rustxWidgets`, so the
# default `cargo build` (which enables `gui`) compiles with no external checkout.
gui = ["dep:rustxwidgets", "rustxwidgets/gtk"]
pancurses = ["dep:rustxwidgets", "rustxwidgets/pancurses"]

[profile.release]
strip = true
lto = true
opt-level = "z"
