[package]
name = "pir"
version = "0.1.0"
edition = "2021"
description = "A featherweight pi-compatible terminal coding agent"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }   # pinned to 2.x (blocking API)

[profile.release]
strip = true
lto = true
