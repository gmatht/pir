[workspace]
members = ["balance-core", "rustxWidgets/gtk_dynamic_loader", "rustxWidgets/rustxwidgets"]

[toolchain]
channel = "nightly"

[package]
name = "corro"
version = "0.6.0"
edition = "2021"
default-run = "corro"

[features]
default = ["ratatui"]
nightly = []
ratatui = ["dep:ratatui", "dep:crossterm", "dep:unicode-truncate", "dep:unicode-segmentation"]
gui = ["dep:rustxwidgets", "rustxwidgets/gtk", "dep:gtk_dynamic_loader"]
pancurses = ["rustxwidgets/pancurses"]
gtk = ["gui"]

[dependencies]
ratatui = { version = "0.29", optional = true }
unicode-width = "0.2.0"
unicode-truncate = { version = "1", optional = true }
crossterm = { version = "0.28", optional = true }
unicode-segmentation = { version = "1", optional = true }
rustxwidgets = { path = "rustxWidgets/rustxwidgets", optional = true }
gtk_dynamic_loader = { path = "rustxWidgets/gtk_dynamic_loader", optional = true }
serde = { version = "1", features = ["derive"] }
notify = "7"
thiserror = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
quick-xml = "0.37"
balance-core = { path = "balance-core" }
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["std", "num-bigint"] }
num-traits = "0.2"
num-complex = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package.balance-core]
opt-level = 2

[profile.release.package.corro]
opt-level = 2

[profile.release.package.ratatui]
opt-level = 2

[profile.release.package.compact_str]
opt-level = 2

[profile.tiny]
inherits = "release"
opt-level = "z"
strip = "symbols"

# Override the inherited O2 per-package settings from release back to "z".
[profile.tiny.package.balance-core]
opt-level = "z"

[profile.tiny.package.corro]
opt-level = "z"

[profile.tiny.package.ratatui]
opt-level = "z"

[profile.tiny.package.compact_str]
opt-level = "z"
