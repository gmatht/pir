[package]
name = "pir"
version = "0.1.0"
edition = "2021"
description = "A featherweight pi-compatible terminal coding agent"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }   # pinned to 2.x (blocking API)
rustyline = "14"                                 # line editing: history + cursor nav + completer
libc = "0.2"                                     # uid/gid drop for per-project users
smol = "2"                                       # async runtime: event-driven stdin wait while a turn runs

# Optional TUI deps, only built when `--features tui` is set (so the default
# binary stays lightweight and the locked build cache is unaffected).
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[features]
# Opt-in full-screen TUI REPL: a real layout engine (no hand-rolled ANSI block)
# with a conversation pane + footer pane (thinking + live draft prompt) and
# in-app scrollback. On by default; pass `--no-tui` to use the streaming REPL.
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[profile.release]
strip = true
lto = true
