name: PGO Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLORS: false

jobs:
  # ── Nightly test: verify `--features nightly` compiles ─────────────
  test-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build with nightly features
        run: cargo build --features nightly
      - name: Test with nightly features
        run: cargo test --features nightly --test render_parity

  # ── Linux x86_64: GNU, with PGO ─────────────────────────────────────
  build-linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-pgo
        run: cargo install cargo-pgo

      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Add LLVM tools to PATH
        run: |
          LLVM_DIR=$(find ~/.rustup -name "llvm-profdata*" -type f 2>/dev/null -exec dirname {} \; | head -1)
          echo "LLVM_DIR=$LLVM_DIR"
          if [ -n "$LLVM_DIR" ]; then
            echo "$LLVM_DIR" >> "$GITHUB_PATH"
          else
            echo "WARNING: llvm-profdata not found in ~/.rustup"
          fi

      - name: Build PGO-instrumented binary
        run: cargo pgo build -- --release

      - name: Determine binary path
        id: triple
        run: |
          TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
          echo "bin=target/$TRIPLE/release/corro" >> "$GITHUB_OUTPUT"

      - name: Run workloads (collect PGO profiles)
        run: |
          BIN=${{ steps.triple.outputs.bin }}
          python3 -c "import time; time.sleep(2); print('q')" | timeout 6 "$BIN" tmp_AG.corro || true
          python3 -c "
          import time, sys
          time.sleep(1)
          for _ in range(8): sys.stdout.write('\x1b[B')
          for _ in range(3): sys.stdout.write('\x1b[C')
          for _ in range(4): sys.stdout.write('\x1b[A')
          sys.stdout.flush()
          time.sleep(1)
          print('q')
          " | timeout 6 "$BIN" tmp_AG.corro || true
          python3 -c "import time; time.sleep(2); print('q')" | timeout 5 "$BIN" tmp.tsv || true

      - name: Build PGO-optimized binary
        run: cargo pgo optimize -- --release
        env:
          RUSTC_WRAPPER: ""

      - name: Strip and compress
        run: |
          BIN=${{ steps.triple.outputs.bin }}
          strip "$BIN"
          7z a -mx=9 -tgzip corro.gz "$BIN"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: corro.gz

  # ── Linux x86_64 tiny: no PGO ───────────────────────────────────────
  build-linux-tiny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross

      - name: Build tiny profile
        run: cross build --target x86_64-unknown-linux-gnu --profile tiny

      - name: Strip and compress
        run: |
          strip target/x86_64-unknown-linux-gnu/tiny/corro
          7z a -mx=9 -tgzip corro-tiny.gz target/x86_64-unknown-linux-gnu/tiny/corro

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: corro-tiny.gz

  # ── Linux armv7hf: cross-compiled (no PGO) ─────────────────────────
  build-linux-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross

      - name: Add ARM target
        run: rustup target add armv7-unknown-linux-gnueabihf

      - name: Build
        run: cross build --target armv7-unknown-linux-gnueabihf --release

      - name: Strip and compress
        run: |
          strip target/armv7-unknown-linux-gnueabihf/release/corro 2>/dev/null || true
          7z a -mx=9 -tgzip corro-arm.gz target/armv7-unknown-linux-gnueabihf/release/corro

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: corro-arm.gz

  # ── Linux aarch64: native ARM runner with PGO ───────────────────────
  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-pgo
        run: cargo install cargo-pgo

      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Add LLVM tools to PATH
        run: |
          LLVM_DIR=$(find ~/.rustup -name "llvm-profdata*" -type f 2>/dev/null -exec dirname {} \; | head -1)
          echo "LLVM_DIR=$LLVM_DIR"
          if [ -n "$LLVM_DIR" ]; then
            echo "$LLVM_DIR" >> "$GITHUB_PATH"
          else
            echo "WARNING: llvm-profdata not found in ~/.rustup"
          fi

      - name: Build PGO-instrumented binary
        run: cargo pgo build -- --release

      - name: Determine binary path
        id: triple
        run: |
          TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
          echo "bin=target/$TRIPLE/release/corro" >> "$GITHUB_OUTPUT"

      - name: Run workloads (collect PGO profiles)
        run: |
          BIN=${{ steps.triple.outputs.bin }}
          python3 -c "import time; time.sleep(2); print('q')" | timeout 6 "$BIN" tmp_AG.corro || true
          python3 -c "
          import time, sys
          time.sleep(1)
          for _ in range(8): sys.stdout.write('\x1b[B')
          for _ in range(3): sys.stdout.write('\x1b[C')
          for _ in range(4): sys.stdout.write('\x1b[A')
          sys.stdout.flush()
          time.sleep(1)
          print('q')
          " | timeout 6 "$BIN" tmp_AG.corro || true
          python3 -c "import time; time.sleep(2); print('q')" | timeout 5 "$BIN" tmp.tsv || true

      - name: Build PGO-optimized binary
        run: cargo pgo optimize -- --release
        env:
          RUSTC_WRAPPER: ""

      - name: Strip and compress
        run: |
          BIN=${{ steps.triple.outputs.bin }}
          strip "$BIN" 2>/dev/null || true
          7z a -mx=9 -tgzip corro-aarch64.gz "$BIN"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: corro-aarch64.gz

  # ── Windows x86_64: release (no PGO) ─────────────────────────────────
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Compress with zip
        shell: bash
        run: |
          7z a -tzip -mx=9 corro.exe.zip target/release/corro.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: corro.exe.zip

  # ── Windows x86: release (no PGO) ────────────────────────────────────
  build-windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Add x86 target
        run: rustup target add i686-pc-windows-msvc

      - name: Build
        run: cargo build --target i686-pc-windows-msvc --release

      - name: Compress with zip
        shell: bash
        run: |
          7z a -tzip -mx=9 corro-x86.exe.zip target/i686-pc-windows-msvc/release/corro.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: corro-x86.exe.zip

  # ── macOS aarch64: PGO ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install coreutils (for gtimeout)
        run: brew install coreutils

      - name: Install cargo-pgo
        run: cargo install cargo-pgo

      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Add LLVM tools to PATH
        run: |
          LLVM_DIR=$(find ~/.rustup -name "llvm-profdata*" -type f 2>/dev/null -exec dirname {} \; | head -1)
          echo "LLVM_DIR=$LLVM_DIR"
          if [ -n "$LLVM_DIR" ]; then
            echo "$LLVM_DIR" >> "$GITHUB_PATH"
          else
            echo "WARNING: llvm-profdata not found in ~/.rustup"
          fi

      - name: Build PGO-instrumented binary
        run: cargo pgo build -- --release

      - name: Determine binary path
        id: triple
        run: |
          TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
          echo "bin=target/$TRIPLE/release/corro" >> "$GITHUB_OUTPUT"

      - name: Run workloads (collect PGO profiles)
        run: |
          BIN=${{ steps.triple.outputs.bin }}
          python3 -c "import time; time.sleep(2); print('q')" | gtimeout 6 "$BIN" tmp_AG.corro || true
          python3 -c "
          import time, sys
          time.sleep(1)
          for _ in range(8): sys.stdout.write('\x1b[B')
          for _ in range(3): sys.stdout.write('\x1b[C')
          for _ in range(4): sys.stdout.write('\x1b[A')
          sys.stdout.flush()
          time.sleep(1)
          print('q')
          " | gtimeout 6 "$BIN" tmp_AG.corro || true
          python3 -c "import time; time.sleep(2); print('q')" | gtimeout 5 "$BIN" tmp.tsv || true

      - name: Build PGO-optimized binary
        run: cargo pgo optimize -- --release
        env:
          RUSTC_WRAPPER: ""

      - name: Strip and compress
        run: |
          BIN=${{ steps.triple.outputs.bin }}
          strip "$BIN"
          7z a -mx=9 -tgzip corro-osx.gz "$BIN"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: corro-osx.gz
